<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="120" fill="#87CEEB"/>
  <!-- Water -->
  <rect x="0" y="80" width="120" height="40" fill="#1E90FF"/>
  <!-- Hull -->
  <polygon points="20,80 100,80 90,95 30,95" fill="#8B4513"/>
  <!-- Mast -->
  <rect x="58" y="20" width="4" height="60" fill="#A0522D"/>
  <!-- Sail -->
  <polygon points="62,25 62,70 95,70" fill="white"/>
  <!-- Small flag -->
  <polygon points="62,20 62,28 72,24" fill="#FF4500"/>
  <!-- Wave lines -->
  <path d="M0,85 Q15,80 30,85 Q45,90 60,85 Q75,80 90,85 Q105,90 120,85" fill="none" stroke="#4169E1" stroke-width="2"/>
</svg>