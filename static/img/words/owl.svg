<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Branch -->
  <rect x="10" y="85" width="100" height="10" rx="5" fill="#8B4513"/>
  <!-- Body -->
  <ellipse cx="60" cy="60" rx="30" ry="35" fill="#A0522D"/>
  <!-- Belly -->
  <ellipse cx="60" cy="65" rx="18" ry="22" fill="#D2B48C"/>
  <!-- Eyes -->
  <circle cx="48" cy="50" r="10" fill="white"/>
  <circle cx="72" cy="50" r="10" fill="white"/>
  <circle cx="48" cy="50" r="5" fill="#333"/>
  <circle cx="72" cy="50" r="5" fill="#333"/>
  <!-- Beak -->
  <polygon points="60,55 57,62 63,62" fill="#FFA500"/>
  <!-- Wings -->
  <ellipse cx="35" cy="65" rx="12" ry="18" fill="#8B4513" transform="rotate(-15,35,65)"/>
  <ellipse cx="85" cy="65" rx="12" ry="18" fill="#8B4513" transform="rotate(15,85,65)"/>
  <!-- Ear tufts -->
  <polygon points="40,30 35,18 45,28" fill="#A0522D"/>
  <polygon points="80,30 85,18 75,28" fill="#A0522D"/>
  <!-- Feet -->
  <rect x="50" y="85" width="6" height="8" rx="2" fill="#FFA500"/>
  <rect x="64" y="85" width="6" height="8" rx="2" fill="#FFA500"/>
</svg>