<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Body -->
  <ellipse cx="60" cy="75" rx="30" ry="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="45" cy="50" rx="16" ry="14" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Horns -->
  <path d="M38 38 Q32 20 28 18" fill="none" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
  <path d="M52 38 Q58 20 62 18" fill="none" stroke="#8B7355" stroke-width="4" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M42 60 Q40 72 38 78" fill="none" stroke="#c0c0c0" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="40" cy="48" r="2.5" fill="#333"/>
  <circle cx="50" cy="48" r="2.5" fill="#333"/>
  <!-- Nose -->
  <ellipse cx="38" cy="55" rx="3" ry="2" fill="#e0b0b0"/>
  <!-- Ears -->
  <ellipse cx="30" cy="44" rx="6" ry="3" fill="#f0f0f0" stroke="#333" stroke-width="1.5" transform="rotate(-20 30 44)"/>
  <ellipse cx="60" cy="44" rx="6" ry="3" fill="#f0f0f0" stroke="#333" stroke-width="1.5" transform="rotate(20 60 44)"/>
  <!-- Legs -->
  <rect x="38" y="88" width="6" height="18" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <rect x="50" y="88" width="6" height="18" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <rect x="64" y="88" width="6" height="18" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <rect x="76" y="88" width="6" height="18" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M88 70 Q96 66 94 60" fill="none" stroke="#f0f0f0" stroke-width="3" stroke-linecap="round"/>
