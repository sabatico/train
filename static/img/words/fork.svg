<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#f0f0f0" rx="10"/>
  <!-- Handle -->
  <rect x="52" y="60" width="16" height="50" rx="4" fill="#c0c0c0"/>
  <rect x="52" y="60" width="16" height="50" rx="4" fill="none" stroke="#888" stroke-width="2"/>
  <!-- Prongs -->
  <rect x="40" y="10" width="6" height="50" rx="2" fill="#c0c0c0"/>
  <rect x="40" y="10" width="6" height="50" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="50" y="10" width="6" height="50" rx="2" fill="#c0c0c0"/>
  <rect x="50" y="10" width="6" height="50" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="60" y="10" width="6" height="50" rx="2" fill="#c0c0c0"/>
  <rect x="60" y="10" width="6" height="50" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="70" y="10" width="6" height="50" rx="2" fill="#c0c0c0"/>
  <rect x="70" y="10" width="6" height="50" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Base connecting prongs -->
  <rect x="38" y="55" width="40" height="8" rx="3" fill="#c0c0c0"/>
  <rect x="38" y="55" width="40" height="8" rx="3" fill="none" stroke="#888" stroke-width="2"/>
</svg>