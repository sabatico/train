<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Bus body -->
  <rect x="10" y="30" width="100" height="50" rx="6" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <!-- Bus top -->
  <rect x="15" y="20" width="90" height="15" rx="4" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <!-- Windows -->
  <rect x="18" y="35" width="18" height="18" rx="2" fill="#87CEEB" stroke="#333" stroke-width="1.5"/>
  <rect x="42" y="35" width="18" height="18" rx="2" fill="#87CEEB" stroke="#333" stroke-width="1.5"/>
  <rect x="66" y="35" width="18" height="18" rx="2" fill="#87CEEB" stroke="#333" stroke-width="1.5"/>
  <rect x="90" y="35" width="18" height="18" rx="2" fill="#87CEEB" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="30" cy="82" r="10" fill="#333"/>
  <circle cx="30" cy="82" r="5" fill="#666"/>
  <circle cx="90" cy="82" r="10" fill="#333"/>
  <circle cx="90" cy="82" r="5" fill="#666"/>
  <!-- Headlight -->
  <rect x="105" y="55" width="6" height="6" rx="1" fill="#FFE066" stroke="#333" stroke-width="1"/>
</svg>