<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" fill="#fef9e8" rx="10"/>
  <!-- Apple body -->
  <circle cx="70" cy="65" r="22" fill="#e63946"/>
  <!-- Apple bite -->
  <circle cx="85" cy="55" r="10" fill="#fef9e8"/>
  <!-- Apple stem -->
  <line x1="70" y1="43" x2="68" y2="30" stroke="#5a3e1b" stroke-width="3" stroke-linecap="round"/>
  <!-- Apple leaf -->
  <ellipse cx="78" cy="35" rx="6" ry="3" fill="#2a9d8f" transform="rotate(20 78 35)"/>
  <!-- Child head -->
  <circle cx="45" cy="50" r="18" fill="#f4c2a1"/>
  <!-- Hair -->
  <path d="M27 45 Q30 25 45 28 Q60 25 63 45" fill="#4a2e1b"/>
  <!-- Eyes -->
  <circle cx="39" cy="48" r="2.5" fill="#1a1a1a"/>
  <circle cx="51" cy="48" r="2.5" fill="#1a1a1a"/>
  <!-- Cheeks -->
  <circle cx="34" cy="55" r="4" fill="#f4a261" opacity="0.5"/>
  <circle cx="56" cy="55" r="4" fill="#f4a261" opacity="0.5"/>
  <!-- Mouth (open, munching) -->
  <ellipse cx="45" cy="58" rx="5" ry="4" fill="#1a1a1a"/>
  <!-- Tongue -->
  <ellipse cx="45" cy="60" rx="3" ry="2" fill="#e63946"/>
  <!-- Body -->
  <rect x="33" y="68" width="24" height="30" rx="6" fill="#457b9d"/>
  <!-- Arms -->
  <line x1="33" y1="75" x2="55" y2="65" stroke="#f4c2a1" stroke-width="5" stroke-linecap="round"/>
  <line x1="57" y1="75" x2="70" y2="60" stroke="#f4c2a1" stroke-width="5" stroke-linecap="round"/>
  <!-- Crumbs -->
  <circle cx="80" cy="72" r="1.5" fill="#d4a373"/>
  <circle cx="84" cy="78" r="1" fill="#d4a373"/>
  <circle cx="76" cy="80" r="1.2" fill="#d4a373"/>
  <circle cx="88" cy="68" r="1" fill="#d4a373"/>
  <circle cx="82" cy="85" r="0.8" fill="#d4a373"/>
</svg>