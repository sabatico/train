<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Tent body - triangle shape -->
  <polygon points="60,15 15,95 105,95" fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>
  <!-- Tent door flap -->
  <polygon points="60,40 40,95 80,95" fill="#4CAF50" stroke="#1B5E20" stroke-width="2"/>
  <!-- Door opening -->
  <polygon points="60,50 47,90 73,90" fill="#1B5E20"/>
  <!-- Tent pole at top -->
  <line x1="60" y1="12" x2="60" y2="18" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="10" y1="95" x2="110" y2="95" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <!-- Small flag on top -->
  <polygon points="60,12 60,4 72,8" fill="#F44336"/>
</svg>