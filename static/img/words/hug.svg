<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Left figure -->
  <circle cx="40" cy="35" r="12" fill="#FFB3B3"/>
  <line x1="40" y1="47" x2="40" y2="80" stroke="#FFB3B3" stroke-width="6" stroke-linecap="round"/>
  <!-- Left arms wrapping around -->
  <line x1="40" y1="55" x2="70" y2="50" stroke="#FFB3B3" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="65" x2="70" y2="60" stroke="#FFB3B3" stroke-width="6" stroke-linecap="round"/>
  <!-- Left legs -->
  <line x1="40" y1="80" x2="30" y2="100" stroke="#FFB3B3" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="80" x2="50" y2="100" stroke="#FFB3B3" stroke-width="6" stroke-linecap="round"/>

  <!-- Right figure -->
  <circle cx="80" cy="35" r="12" fill="#B3D9FF"/>
  <line x1="80" y1="47" x2="80" y2="80" stroke="#B3D9FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Right arms wrapping around -->
  <line x1="80" y1="55" x2="50" y2="50" stroke="#B3D9FF" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="65" x2="50" y2="60" stroke="#B3D9FF" stroke-width="6" stroke-linecap="round"/>
  <!-- Right legs -->
  <line x1="80" y1="80" x2="70" y2="100" stroke="#B3D9FF" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="90" y2="100" stroke="#B3D9FF" stroke-width="6" stroke-linecap="round"/>
</svg>