<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Sky -->
  <rect width="120" height="120" fill="#87CEEB"/>
  <!-- Mountain -->
  <polygon points="10,100 60,20 110,100" fill="#6B8E23"/>
  <polygon points="60,20 110,100 60,100" fill="#556B2F"/>
  <!-- Snow cap -->
  <polygon points="60,20 50,40 70,40" fill="white"/>
  <!-- Trail -->
  <path d="M20,100 Q40,80 50,70 Q60,60 55,50" stroke="#8B4513" stroke-width="3" fill="none"/>
  <!-- Person body -->
  <circle cx="55" cy="48" r="5" fill="#FFD700"/>
  <!-- Backpack -->
  <rect x="58" y="48" width="6" height="8" rx="1" fill="#D2691E"/>
  <!-- Body -->
  <line x1="55" y1="53" x2="55" y2="65" stroke="#FFD700" stroke-width="4"/>
  <!-- Legs -->
  <line x1="55" y1="65" x2="50" y2="80" stroke="#FFD700" stroke-width="3"/>
  <line x1="55" y1="65" x2="60" y2="80" stroke="#FFD700" stroke-width="3"/>
  <!-- Arm with walking stick -->
  <line x1="55" y1="55" x2="45" y2="60" stroke="#FFD700" stroke-width="3"/>
  <line x1="45" y1="60" x2="40" y2="70" stroke="#8B4513" stroke-width="2"/>
  <!-- Sun -->
  <circle cx="100" cy="20" r="12" fill="#FFD700"/>
  <line x1="100" y1="5" x2="100" y2="0" stroke="#FFD700" stroke-width="2"/>
  <line x1="100" y1="35" x2="100" y2="40" stroke="#FFD700" stroke-width="2"/>
  <line x1="85" y1="20" x2="80" y2="20" stroke="#FFD700" stroke-width="2"/>
  <line x1="115" y1="20" x2="120" y2="20" stroke="#FFD700" stroke-width="2"/>
  <line x1="89" y1="9" x2="85" y2="5" stroke="#FFD700" stroke-width="2"/>
  <line x1="111" y1="31" x2="115" y2="35" stroke="#FFD700" stroke-width="2"/>
  <line x1="111" y1="9" x2="115" y2="5" stroke="#FFD700" stroke-width="2"/>
  <line x1="89" y1="31" x2="85" y2="35" stroke="#FFD700" stroke-width="2"/>
</svg>