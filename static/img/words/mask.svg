  <line x1="35" y1="56" x2="85" y2="56" stroke="#0288D1" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="64" x2="85" y2="64" stroke="#0288D1" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="72" x2="85" y2="72" stroke="#0288D1" stroke-width="1.5" opacity="0.5"/>
  <!-- Left string -->
  <path d="M35 52 Q20 40 18 30" fill="none" stroke="#0288D1" stroke-width="2" stroke-linecap="round"/>
  <!-- Right string -->
  <path d="M85 52 Q100 40 102 30" fill="none" stroke="#0288D1" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom left string -->
