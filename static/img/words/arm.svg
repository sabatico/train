  <rect x="72" y="20" width="6" height="14" rx="3" fill="#F5C6A0"/>
  <rect x="80" y="18" width="6" height="16" rx="3" fill="#F5C6A0"/>
  <rect x="88" y="22" width="6" height="12" rx="3" fill="#F5C6A0"/>
  <!-- Finger outlines -->
  <rect x="72" y="20" width="6" height="14" rx="3" fill="none" stroke="#D4A373" stroke-width="1"/>
  <rect x="80" y="18" width="6" height="16" rx="3" fill="none" stroke="#D4A373" stroke-width="1"/>
  <rect x="88" y="22" width="6" height="12" rx="3" fill="none" stroke="#D4A373" stroke-width="1"/>
  <rect x="88" y="28" width="8" height="14" rx="4" fill="none" stroke="#D4A373" stroke-width="1"/>
  <rect x="30" y="40" width="50" height="18" rx="8" fill="none" stroke="#D4A373" stroke-width="1"/>
  <rect x="70" y="30" width="20" height="30" rx="8" fill="none" stroke="#D4A373" stroke-width="1"/>
</svg>