<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Arm -->
  <rect x="30" y="40" width="50" height="18" rx="8" fill="#F5C6A0"/>
  <!-- Hand -->
  <rect x="70" y="30" width="20" height="30" rx="8" fill="#F5C6A0"/>
  <!-- Thumb -->
  <rect x="88" y="28" width="8" height="14" rx="4" fill="#F5C6A0"/>
