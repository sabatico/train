<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Folded map body -->
  <rect x="15" y="20" width="90" height="80" rx="3" fill="#f5e6c8" stroke="#c4a86a" stroke-width="2"/>
  
  <!-- Fold lines -->
  <line x1="60" y1="20" x2="60" y2="100" stroke="#d4b87a" stroke-width="1.5"/>
  <line x1="15" y1="60" x2="105" y2="60" stroke="#d4b87a" stroke-width="1.5"/>
  
  <!-- Winding roads -->
  <path d="M20 50 Q35 35 45 50 T65 45 T80 55 T95 40" fill="none" stroke="#a0522d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30 70 Q45 60 50 75 T70 70 T85 80" fill="none" stroke="#a0522d" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Small road dots / towns -->
  <circle cx="45" cy="50" r="2.5" fill="#a0522d"/>
  <circle cx="65" cy="45" r="2.5" fill="#a0522d"/>
  <circle cx="50" cy="75" r="2.5" fill="#a0522d"/>
  
  <!-- Red X mark -->
  <line x1="75" y1="30" x2="90" y2="45" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="30" x2="75" y2="45" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Map fold shadow lines -->
  <line x1="15" y1="22" x2="105" y2="22" stroke="#e8d4a8" stroke-width="1" opacity="0.5"/>
</svg>