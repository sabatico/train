<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Boot body -->
  <path d="M30 90 L30 50 Q30 30 45 25 L75 25 Q85 25 85 35 L85 90 Z" fill="#8B4513"/>
  <!-- Boot sole -->
  <rect x="25" y="90" width="65" height="12" rx="3" fill="#2F2F2F"/>
  <!-- Boot top opening -->
  <rect x="35" y="20" width="40" height="10" rx="2" fill="#A0522D"/>
  <!-- Boot top highlight -->
  <rect x="38" y="22" width="34" height="6" rx="2" fill="#CD853F"/>
  <!-- Boot toe curve -->
  <ellipse cx="30" cy="85" rx="8" ry="6" fill="#8B4513"/>
  <!-- Boot heel -->
  <rect x="75" y="85" width="12" height="8" rx="2" fill="#2F2F2F"/>
  <!-- Boot lace holes (simple dots) -->
  <circle cx="50" cy="35" r="2" fill="#2F2F2F"/>
  <circle cx="50" cy="45" r="2" fill="#2F2F2F"/>
  <circle cx="50" cy="55" r="2" fill="#2F2F2F"/>
</svg>