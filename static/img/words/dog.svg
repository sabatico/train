<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#87CEEB"/>
  <!-- Body -->
  <ellipse cx="60" cy="75" rx="30" ry="18" fill="#D2691E"/>
  <!-- Head -->
  <circle cx="40" cy="50" r="16" fill="#D2691E"/>
  <!-- Ears -->
  <ellipse cx="30" cy="38" rx="8" ry="12" fill="#8B4513" transform="rotate(-20 30 38)"/>
  <ellipse cx="50" cy="38" rx="8" ry="12" fill="#8B4513" transform="rotate(20 50 38)"/>
  <!-- Eyes -->
  <circle cx="35" cy="48" r="3" fill="#000"/>
  <circle cx="45" cy="48" r="3" fill="#000"/>
  <!-- Nose -->
  <ellipse cx="40" cy="56" rx="4" ry="3" fill="#000"/>
  <!-- Mouth -->
  <path d="M36 60 Q40 66 44 60" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M88 70 Q100 55 95 45" fill="none" stroke="#D2691E" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs -->
  <rect x="38" y="88" width="6" height="18" rx="3" fill="#D2691E"/>
  <rect x="50" y="88" width="6" height="18" rx="3" fill="#D2691E"/>
  <rect x="62" y="88" width="6" height="18" rx="3" fill="#D2691E"/>
  <rect x="74" y="88" width="6" height="18" rx="3" fill="#D2691E"/>
  <!-- Paws -->
  <ellipse cx="41" cy="106" rx="5" ry="3" fill="#8B4513"/>
  <ellipse cx="53" cy="106" rx="5" ry="3" fill="#8B4513"/>
  <ellipse cx="65" cy="106" rx="5" ry="3" fill="#8B4513"/>
  <ellipse cx="77" cy="106" rx="5" ry="3" fill="#8B4513"/>
</svg>