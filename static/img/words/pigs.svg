<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Left pig body -->
  <ellipse cx="40" cy="75" rx="22" ry="18" fill="#FFB6C1"/>
  <!-- Left pig head -->
  <circle cx="40" cy="55" r="14" fill="#FFB6C1"/>
  <!-- Left pig snout -->
  <ellipse cx="40" cy="58" rx="6" ry="4" fill="#FF69B4"/>
