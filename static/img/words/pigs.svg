  <ellipse cx="80" cy="58" rx="6" ry="4" fill="#FF69B4"/>
  <!-- Right pig nostrils -->
  <circle cx="78" cy="58" r="1.5" fill="#C71585"/>
  <circle cx="82" cy="58" r="1.5" fill="#C71585"/>
  <!-- Right pig eyes -->
  <circle cx="75" cy="52" r="2.5" fill="#333"/>
  <circle cx="85" cy="52" r="2.5" fill="#333"/>
  <!-- Right pig ears -->
  <ellipse cx="68" cy="42" rx="5" ry="7" fill="#FFB6C1" transform="rotate(-20 68 42)"/>
  <ellipse cx="92" cy="42" rx="5" ry="7" fill="#FFB6C1" transform="rotate(20 92 42)"/>
  <!-- Right pig legs -->
  <rect x="68" y="88" width="6" height="12" rx="3" fill="#FFB6C1"/>
  <rect x="86" y="88" width="6" height="12" rx="3" fill="#FFB6C1"/>
  <!-- Right pig tail -->
  <path d="M102 70 Q110 65 106 58 Q102 52 108 48" fill="none" stroke="#FFB6C1" stroke-width="3" stroke-linecap="round"/>
