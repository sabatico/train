<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Bathtub body -->
  <rect x="15" y="55" width="90" height="45" rx="10" ry="10" fill="#7ec8e3" stroke="#4a90d9" stroke-width="3"/>
  <!-- Bathtub rim -->
  <rect x="12" y="50" width="96" height="8" rx="4" ry="4" fill="#4a90d9"/>
  <!-- Water surface -->
  <rect x="20" y="58" width="80" height="20" rx="5" ry="5" fill="#a0d8ef" opacity="0.8"/>
  <!-- Bubbles -->
  <circle cx="35" cy="52" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="50" cy="48" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="68" cy="50" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="82" cy="46" r="9" fill="#ffffff" opacity="0.9"/>
  <circle cx="42" cy="44" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="42" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="75" cy="40" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- Bathtub feet -->
  <ellipse cx="25" cy="102" rx="6" ry="4" fill="#d4a574" stroke="#b8864a" stroke-width="2"/>
  <ellipse cx="95" cy="102" rx="6" ry="4" fill="#d4a574" stroke="#b8864a" stroke-width="2"/>
  <!-- Faucet -->
  <rect x="85" y="30" width="8" height="20" rx="3" ry="3" fill="#c0c0c0" stroke="#888" stroke-width="1.5"/>
  <circle cx="89" cy="28" r="5" fill="#c0c0c0" stroke="#888" stroke-width="1.5"/>
  <!-- Water drop from faucet -->
  <ellipse cx="89" cy="42" rx="2" ry="3" fill="#a0d8ef"/>
</svg>