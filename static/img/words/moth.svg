<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" fill="#1a1a2e"/>
  <!-- Light glow -->
  <circle cx="60" cy="30" r="25" fill="#fff9c4" opacity="0.3"/>
  <circle cx="60" cy="30" r="15" fill="#fff9c4" opacity="0.5"/>
  <circle cx="60" cy="30" r="8" fill="#fffde7"/>
  <!-- Light bulb -->
  <rect x="55" y="15" width="10" height="12" rx="3" fill="#fff9c4"/>
  <rect x="57" y="10" width="6" height="6" rx="2" fill="#b0bec5"/>
  <!-- Moth body -->
  <ellipse cx="60" cy="70" rx="4" ry="12" fill="#5d4037"/>
  <!-- Left wing -->
  <ellipse cx="40" cy="65" rx="18" ry="12" fill="#8d6e63" transform="rotate(-15,40,65)"/>
  <ellipse cx="42" cy="62" rx="12" ry="8" fill="#a1887f" transform="rotate(-15,42,62)"/>
  <circle cx="35" cy="60" r="3" fill="#6d4c41"/>
  <circle cx="45" cy="58" r="2" fill="#6d4c41"/>
  <!-- Right wing -->
  <ellipse cx="80" cy="65" rx="18" ry="12" fill="#8d6e63" transform="rotate(15,80,65)"/>
  <ellipse cx="78" cy="62" rx="12" ry="8" fill="#a1887f" transform="rotate(15,78,62)"/>
  <circle cx="85" cy="60" r="3" fill="#6d4c41"/>
  <circle cx="75" cy="58" r="2" fill="#6d4c41"/>
  <!-- Antennae -->
  <path d="M58 58 Q50 45 48 40" stroke="#5d4037" stroke-width="1.5" fill="none"/>
  <path d="M62 58 Q70 45 72 40" stroke="#5d4037" stroke-width="1.5" fill="none"/>
  <circle cx="48" cy="40" r="2" fill="#5d4037"/>
  <circle cx="72" cy="40" r="2" fill="#5d4037"/>
</svg>