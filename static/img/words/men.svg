<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Three stick figure men standing together -->
  <!-- Left man -->
  <circle cx="30" cy="25" r="10" fill="#4A90D9"/>
  <line x1="30" y1="35" x2="30" y2="75" stroke="#4A90D9" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="45" x2="12" y2="60" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="45" x2="48" y2="60" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="75" x2="18" y2="100" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="75" x2="42" y2="100" stroke="#4A90D9" stroke-width="4" stroke-linecap="round"/>

  <!-- Center man -->
  <circle cx="60" cy="20" r="10" fill="#E67E22"/>
  <line x1="60" y1="30" x2="60" y2="70" stroke="#E67E22" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="42" y2="55" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="78" y2="55" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="70" x2="48" y2="95" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="70" x2="72" y2="95" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>

  <!-- Right man -->
  <circle cx="90" cy="25" r="10" fill="#27AE60"/>
  <line x1="90" y1="35" x2="90" y2="75" stroke="#27AE60" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="45" x2="72" y2="60" stroke="#27AE60" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="45" x2="108" y2="60" stroke="#27AE60" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="75" x2="78" y2="100" stroke="#27AE60" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="75" x2="102" y2="100" stroke="#27AE60" stroke-width="4" stroke-linecap="round"/>
</svg>