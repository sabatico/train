<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Head -->
  <circle cx="60" cy="45" r="30" fill="#FFDAB9" stroke="#333" stroke-width="3"/>
  <!-- Open mouth -->
  <ellipse cx="60" cy="55" rx="12" ry="8" fill="#333"/>
  <!-- Food (apple) being bitten -->
  <circle cx="78" cy="48" r="14" fill="#E63946" stroke="#333" stroke-width="2"/>
  <!-- Bite taken out of apple -->
  <circle cx="68" cy="44" r="6" fill="#FFDAB9" stroke="#333" stroke-width="1"/>
  <!-- Apple stem -->
  <line x1="78" y1="34" x2="78" y2="28" stroke="#333" stroke-width="2"/>
  <!-- Leaf -->
  <ellipse cx="82" cy="30" rx="5" ry="3" fill="#2A9D8F" transform="rotate(20 82 30)"/>
  <!-- Eyes -->
  <circle cx="48" cy="38" r="4" fill="#333"/>
  <circle cx="68" cy="38" r="4" fill="#333"/>
  <!-- Eyebrows (happy) -->
  <line x1="44" y1="32" x2="52" y2="30" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="30" x2="72" y2="32" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Hand holding apple -->
  <circle cx="72" cy="60" r="6" fill="#FFDAB9" stroke="#333" stroke-width="2"/>
</svg>