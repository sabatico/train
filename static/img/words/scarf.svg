<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Scarf wrapped around neck -->
  <rect x="30" y="20" width="60" height="30" rx="8" fill="#E74C3C"/>
  <!-- Scarf hanging end left -->
  <rect x="25" y="40" width="22" height="55" rx="6" fill="#E74C3C"/>
  <!-- Scarf hanging end right -->
  <rect x="73" y="40" width="22" height="55" rx="6" fill="#C0392B"/>
  <!-- Fringe on left end -->
  <line x1="28" y1="95" x2="28" y2="105" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="95" x2="34" y2="105" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="95" x2="40" y2="105" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
  <!-- Fringe on right end -->
  <line x1="76" y1="95" x2="76" y2="105" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="95" x2="82" y2="105" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="95" x2="88" y2="105" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <!-- Stripe on wrapped part -->
  <rect x="30" y="28" width="60" height="4" fill="#C0392B"/>
  <rect x="30" y="38" width="60" height="4" fill="#C0392B"/>
  <!-- Stripe on left hanging end -->
  <rect x="25" y="55" width="22" height="4" fill="#C0392B"/>
  <rect x="25" y="70" width="22" height="4" fill="#C0392B"/>
  <!-- Stripe on right hanging end -->
  <rect x="73" y="55" width="22" height="4" fill="#E74C3C"/>
  <rect x="73" y="70" width="22" height="4" fill="#E74C3C"/>
</svg>