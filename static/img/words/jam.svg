<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Jar body -->
  <rect x="30" y="35" width="60" height="65" rx="8" fill="#E8D5B7" stroke="#8B6914" stroke-width="2"/>
  <!-- Jar lid -->
  <rect x="28" y="28" width="64" height="12" rx="4" fill="#D32F2F" stroke="#8B0000" stroke-width="2"/>
  <!-- Jam inside -->
  <rect x="34" y="45" width="52" height="50" rx="4" fill="#D32F2F"/>
  <!-- Jam highlight -->
  <ellipse cx="50" cy="55" rx="12" ry="6" fill="#E53935" opacity="0.6"/>
  <!-- Spoon handle -->
  <rect x="72" y="10" width="6" height="50" rx="3" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5" transform="rotate(20, 75, 35)"/>
  <!-- Spoon bowl -->
  <ellipse cx="78" cy="58" rx="8" ry="5" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5" transform="rotate(20, 78, 58)"/>
  <!-- Label on jar -->
  <rect x="38" y="65" width="44" height="20" rx="3" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <!-- Small jam dots on label (decorative) -->
  <circle cx="48" cy="75" r="3" fill="#D32F2F"/>
  <circle cx="60" cy="75" r="3" fill="#D32F2F"/>
  <circle cx="72" cy="75" r="3" fill="#D32F2F"/>
</svg>