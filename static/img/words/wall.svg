<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect x="10" y="10" width="100" height="100" fill="#C0392B" rx="2"/>
  <!-- Horizontal mortar lines -->
  <line x1="10" y1="30" x2="110" y2="30" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="10" y1="50" x2="110" y2="50" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="10" y1="70" x2="110" y2="70" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="10" y1="90" x2="110" y2="90" stroke="#D5D8DC" stroke-width="2"/>
  <!-- Vertical mortar lines (offset for brick pattern) -->
  <line x1="30" y1="10" x2="30" y2="30" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="60" y1="10" x2="60" y2="30" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="90" y1="10" x2="90" y2="30" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="15" y1="30" x2="15" y2="50" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="45" y1="30" x2="45" y2="50" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="75" y1="30" x2="75" y2="50" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="105" y1="30" x2="105" y2="50" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="30" y1="50" x2="30" y2="70" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="60" y1="50" x2="60" y2="70" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="90" y1="50" x2="90" y2="70" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="15" y1="70" x2="15" y2="90" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="45" y1="70" x2="45" y2="90" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="75" y1="70" x2="75" y2="90" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="105" y1="70" x2="105" y2="90" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="30" y1="90" x2="30" y2="110" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="60" y1="90" x2="60" y2="110" stroke="#D5D8DC" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="110" stroke="#D5D8DC" stroke-width="2"/>
</svg>