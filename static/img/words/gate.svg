<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" fill="#87CEEB"/>
  <!-- Gate posts -->
  <rect x="20" y="10" width="10" height="100" fill="#8B4513" rx="2"/>
  <rect x="90" y="10" width="10" height="100" fill="#8B4513" rx="2"/>
  <!-- Horizontal bars -->
  <rect x="30" y="20" width="60" height="8" fill="#A0522D" rx="2"/>
  <rect x="30" y="45" width="60" height="8" fill="#A0522D" rx="2"/>
  <rect x="30" y="70" width="60" height="8" fill="#A0522D" rx="2"/>
  <rect x="30" y="95" width="60" height="8" fill="#A0522D" rx="2"/>
  <!-- Diagonal brace -->
  <line x1="30" y1="20" x2="90" y2="103" stroke="#A0522D" stroke-width="6" stroke-linecap="round"/>
  <!-- Latch -->
  <rect x="75" y="50" width="20" height="6" fill="#D2B48C" rx="2"/>
  <circle cx="95" cy="53" r="4" fill="#D2B48C"/>
  <!-- Grass -->
  <rect x="0" y="110" width="120" height="10" fill="#228B22"/>
</svg>