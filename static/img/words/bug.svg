<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Body -->
  <ellipse cx="60" cy="65" rx="28" ry="20" fill="#4a7c3f"/>
  <!-- Head -->
  <circle cx="60" cy="42" r="12" fill="#3a6630"/>
  <!-- Eyes -->
  <circle cx="55" cy="39" r="3" fill="white"/>
  <circle cx="65" cy="39" r="3" fill="white"/>
  <circle cx="55" cy="39" r="1.5" fill="#1a1a1a"/>
  <circle cx="65" cy="39" r="1.5" fill="#1a1a1a"/>
  <!-- Antennae -->
  <line x1="55" y1="32" x2="45" y2="18" stroke="#3a6630" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="32" x2="75" y2="18" stroke="#3a6630" stroke-width="2" stroke-linecap="round"/>
  <circle cx="45" cy="18" r="2.5" fill="#3a6630"/>
  <circle cx="75" cy="18" r="2.5" fill="#3a6630"/>
  <!-- Legs -->
  <line x1="36" y1="58" x2="20" y2="50" stroke="#3a6630" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="65" x2="18" y2="65" stroke="#3a6630" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="72" x2="20" y2="80" stroke="#3a6630" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="58" x2="100" y2="50" stroke="#3a6630" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="65" x2="102" y2="65" stroke="#3a6630" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="72" x2="100" y2="80" stroke="#3a6630" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wing line -->
  <line x1="60" y1="48" x2="60" y2="82" stroke="#3a6630" stroke-width="1" opacity="0.4"/>
</svg>