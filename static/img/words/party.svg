<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cake base -->
  <rect x="25" y="70" width="70" height="30" rx="3" fill="#F4A460"/>
  <!-- Cake top layer -->
  <rect x="30" y="55" width="60" height="20" rx="3" fill="#FFD700"/>
  <!-- Frosting drips -->
  <path d="M30 55 Q35 65 40 55 Q45 65 50 55 Q55 65 60 55 Q65 65 70 55 Q75 65 80 55 Q85 65 90 55" fill="#FF69B4"/>
  <!-- Candles -->
  <rect x="45" y="35" width="4" height="20" fill="#FF4500"/>
  <rect x="58" y="30" width="4" height="25" fill="#00CED1"/>
  <rect x="71" y="35" width="4" height="20" fill="#32CD32"/>
  <!-- Candle flames -->
  <ellipse cx="47" cy="32" rx="3" ry="5" fill="#FFD700"/>
  <ellipse cx="60" cy="27" rx="3" ry="5" fill="#FFD700"/>
  <ellipse cx="73" cy="32" rx="3" ry="5" fill="#FFD700"/>
  <!-- Balloon strings -->
  <line x1="20" y1="70" x2="20" y2="50" stroke="#888" stroke-width="1.5"/>
  <line x1="100" y1="70" x2="100" y2="45" stroke="#888" stroke-width="1.5"/>
  <line x1="110" y1="70" x2="110" y2="55" stroke="#888" stroke-width="1.5"/>
  <!-- Balloons -->
  <ellipse cx="20" cy="35" rx="12" ry="15" fill="#FF6347"/>
  <ellipse cx="100" cy="28" rx="12" ry="15" fill="#9370DB"/>
  <ellipse cx="110" cy="40" rx="10" ry="13" fill="#FFB6C1"/>
  <!-- Balloon highlights -->
  <ellipse cx="16" cy="30" rx="4" ry="6" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="96" cy="23" rx="4" ry="6" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="107" cy="36" rx="3" ry="5" fill="rgba(255,255,255,0.4)"/>
  <!-- Cake plate -->
  <rect x="20" y="98" width="80" height="6" rx="3" fill="#C0C0C0"/>
</svg>