<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" fill="#f0f8e8" rx="10"/>
  
  <!-- Cutting board -->
  <rect x="20" y="75" width="80" height="12" rx="3" fill="#d4a056"/>
  <rect x="20" y="75" width="80" height="4" rx="2" fill="#e0b86a"/>
  
  <!-- Carrot -->
  <ellipse cx="60" cy="72" rx="14" ry="8" fill="#e67e22"/>
  <polygon points="46,72 40,60 44,65" fill="#e67e22"/>
  <polygon points="74,72 80,60 76,65" fill="#e67e22"/>
  <!-- Carrot top greens -->
  <line x1="60" y1="64" x2="55" y2="50" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="64" x2="62" y2="48" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="64" x2="68" y2="52" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cleaver blade -->
  <rect x="52" y="20" width="30" height="40" rx="5" fill="#95a5a6"/>
  <rect x="52" y="20" width="30" height="40" rx="5" fill="url(#blade)" opacity="0.3"/>
  <rect x="54" y="22" width="26" height="36" rx="4" fill="#bdc3c7"/>
  
  <!-- Cleaver handle -->
  <rect x="58" y="8" width="18" height="14" rx="4" fill="#8B4513"/>
  <rect x="60" y="10" width="14" height="10" rx="3" fill="#a0522d"/>
  
  <!-- Hand (simplified) -->
  <ellipse cx="38" cy="30" rx="16" ry="12" fill="#f5cba7"/>
  <!-- Fingers -->
  <rect x="28" y="18" width="6" height="14" rx="3" fill="#f5cba7"/>
  <rect x="36" y="16" width="6" height="16" rx="3" fill="#f5cba7"/>
  <rect x="44" y="18" width="6" height="14" rx="3" fill="#f5cba7"/>
  <!-- Thumb -->
  <rect x="22" y="28" width="6" height="10" rx="3" fill="#f5cba7" transform="rotate(-20,25,33)"/>
  
  <!-- Chop motion lines -->
  <line x1="72" y1="18" x2="72" y2="8" stroke="#555" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="78" y1="20" x2="80" y2="10" stroke="#555" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="66" y1="16" x2="64" y2="6" stroke="#555" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Small chop impact lines -->
  <line x1="58" y1="60" x2="54" y2="56" stroke="#555" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="70" y1="60" x2="74" y2="56" stroke="#555" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>