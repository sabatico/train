<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Ham body -->
  <ellipse cx="60" cy="65" rx="40" ry="25" fill="#E8A0A0" stroke="#C07070" stroke-width="2"/>
  <!-- Ham darker top -->
  <ellipse cx="60" cy="55" rx="35" ry="18" fill="#D4888A" stroke="#C07070" stroke-width="1.5"/>
  <!-- Fat/marbling lines -->
  <path d="M35 50 Q50 45 60 52" fill="none" stroke="#F5D0D0" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 60 Q70 55 80 62" fill="none" stroke="#F5D0D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Bone sticking out from left end -->
  <rect x="18" y="58" width="18" height="8" rx="3" fill="#F0E8D8" stroke="#C0B090" stroke-width="1.5"/>
  <!-- Bone knob -->
  <circle cx="18" cy="62" r="6" fill="#F0E8D8" stroke="#C0B090" stroke-width="1.5"/>
  <!-- Bone highlight -->
  <circle cx="16" cy="60" r="2" fill="#FFF8E8" opacity="0.6"/>
</svg>