<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Paper -->
  <rect x="30" y="40" width="70" height="60" rx="3" fill="#f5f5dc" stroke="#333" stroke-width="3"/>
  <!-- Cut line -->
  <line x1="30" y1="70" x2="100" y2="70" stroke="#999" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Left scissor blade -->
  <polygon points="65,60 20,20 25,15 70,55" fill="#e74c3c" stroke="#333" stroke-width="2"/>
  <!-- Right scissor blade -->
  <polygon points="65,60 20,100 25,105 70,65" fill="#e74c3c" stroke="#333" stroke-width="2"/>
  <!-- Scissor pivot -->
  <circle cx="65" cy="60" r="5" fill="#555" stroke="#333" stroke-width="2"/>
  <!-- Left handle -->
  <ellipse cx="85" cy="35" rx="12" ry="8" fill="#e74c3c" stroke="#333" stroke-width="2" transform="rotate(-30,85,35)"/>
  <ellipse cx="85" cy="35" rx="6" ry="4" fill="#f5f5dc" stroke="#333" stroke-width="1.5" transform="rotate(-30,85,35)"/>
  <!-- Right handle -->
  <ellipse cx="85" cy="85" rx="12" ry="8" fill="#e74c3c" stroke="#333" stroke-width="2" transform="rotate(30,85,85)"/>
  <ellipse cx="85" cy="85" rx="6" ry="4" fill="#f5f5dc" stroke="#333" stroke-width="1.5" transform="rotate(30,85,85)"/>
</svg>