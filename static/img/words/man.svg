<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Hat brim -->
  <rect x="30" y="25" width="60" height="8" rx="2" fill="#333"/>
  <!-- Hat crown -->
  <rect x="40" y="10" width="40" height="18" rx="3" fill="#333"/>
  <!-- Head -->
  <circle cx="60" cy="45" r="14" fill="#f5cba7"/>
  <!-- Body -->
  <line x1="60" y1="59" x2="60" y2="95" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="60" y1="70" x2="35" y2="85" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="60" y1="70" x2="85" y2="85" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="60" y1="95" x2="42" y2="115" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="60" y1="95" x2="78" y2="115" stroke="#333" stroke-width="4" stroke-linecap="round"/>
</svg>