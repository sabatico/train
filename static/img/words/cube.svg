<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Front face -->
  <polygon points="30,40 90,40 90,90 30,90" fill="#4A90D9" stroke="#2C5F8A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top face -->
  <polygon points="30,40 60,15 120,15 90,40" fill="#6BB3F0" stroke="#2C5F8A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right face -->
  <polygon points="90,40 120,15 120,65 90,90" fill="#3A7BC8" stroke="#2C5F8A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Visible edges (top front edge highlight) -->
  <line x1="30" y1="40" x2="60" y2="15" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="60" y1="15" x2="120" y2="15" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="120" y1="15" x2="90" y2="40" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="90" y1="40" x2="30" y2="40" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="30" y1="40" x2="30" y2="90" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="90" y1="40" x2="90" y2="90" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="30" y1="90" x2="90" y2="90" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="120" y1="15" x2="120" y2="65" stroke="#2C5F8A" stroke-width="2.5"/>
  <line x1="120" y1="65" x2="90" y2="90" stroke="#2C5F8A" stroke-width="2.5"/>
</svg>