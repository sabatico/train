  <path d="M38 38 Q38 28 60 26 Q82 28 82 38" fill="#f8e8e0" stroke="#c49a8a" stroke-width="2"/>
  <ellipse cx="60" cy="38" rx="20" ry="5" fill="#fff0e8" stroke="#c49a8a" stroke-width="1.5"/>
</svg>