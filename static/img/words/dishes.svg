  <ellipse cx="60" cy="83" rx="35" ry="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Middle plate -->
  <ellipse cx="60" cy="70" rx="38" ry="9" fill="#e8e8e8" stroke="#999" stroke-width="2"/>
  <ellipse cx="60" cy="68" rx="33" ry="7" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Bowl on top -->
  <ellipse cx="60" cy="52" rx="30" ry="8" fill="#d4e8f0" stroke="#7ab8d4" stroke-width="2"/>
  <path d="M30 52 Q30 38 60 35 Q90 38 90 52" fill="#e8f4f8" stroke="#7ab8d4" stroke-width="2"/>
  <ellipse cx="60" cy="52" rx="28" ry="6" fill="#f0faff" stroke="#7ab8d4" stroke-width="1.5"/>
  
  <!-- Small bowl on top -->
