<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Bed frame -->
  <rect x="15" y="60" width="90" height="40" rx="4" fill="#8B4513"/>
  <!-- Headboard -->
  <rect x="15" y="35" width="12" height="65" rx="3" fill="#A0522D"/>
  <!-- Footboard -->
  <rect x="93" y="55" width="12" height="45" rx="3" fill="#A0522D"/>
  <!-- Mattress -->
  <rect x="27" y="62" width="66" height="35" rx="3" fill="#F5F5DC"/>
  <!-- Pillow -->
  <rect x="30" y="64" width="28" height="18" rx="6" fill="#FFFAF0" stroke="#DDD" stroke-width="1"/>
  <!-- Blanket -->
  <rect x="58" y="64" width="32" height="30" rx="4" fill="#4682B4"/>
  <!-- Blanket pattern (simple stripes) -->
  <rect x="58" y="72" width="32" height="4" fill="#5B9BD5"/>
  <rect x="58" y="80" width="32" height="4" fill="#5B9BD5"/>
  <rect x="58" y="88" width="32" height="4" fill="#5B9BD5"/>
  <!-- Bed legs -->
  <rect x="18" y="97" width="6" height="8" rx="2" fill="#8B4513"/>
  <rect x="96" y="97" width="6" height="8" rx="2" fill="#8B4513"/>
</svg>