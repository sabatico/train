<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Stove body -->
  <rect x="15" y="35" width="90" height="70" rx="6" ry="6" fill="#555" stroke="#333" stroke-width="3"/>
  <!-- Stove top surface -->
  <rect x="15" y="35" width="90" height="10" rx="4" ry="4" fill="#777" stroke="#333" stroke-width="2"/>
  <!-- Burner circles -->
  <circle cx="38" cy="55" r="12" fill="#222" stroke="#444" stroke-width="2"/>
  <circle cx="82" cy="55" r="12" fill="#222" stroke="#444" stroke-width="2"/>
  <circle cx="38" cy="80" r="12" fill="#222" stroke="#444" stroke-width="2"/>
  <circle cx="82" cy="80" r="12" fill="#222" stroke="#444" stroke-width="2"/>
  <!-- Inner burner details -->
  <circle cx="38" cy="55" r="6" fill="#444"/>
  <circle cx="82" cy="55" r="6" fill="#444"/>
  <circle cx="38" cy="80" r="6" fill="#444"/>
  <circle cx="82" cy="80" r="6" fill="#444"/>
  <!-- Knobs -->
  <circle cx="28" cy="100" r="5" fill="#888" stroke="#333" stroke-width="2"/>
  <circle cx="48" cy="100" r="5" fill="#888" stroke="#333" stroke-width="2"/>
  <circle cx="72" cy="100" r="5" fill="#888" stroke="#333" stroke-width="2"/>
  <circle cx="92" cy="100" r="5" fill="#888" stroke="#333" stroke-width="2"/>
  <!-- Knob indicators -->
  <line x1="28" y1="96" x2="28" y2="100" stroke="#222" stroke-width="2"/>
  <line x1="48" y1="96" x2="48" y2="100" stroke="#222" stroke-width="2"/>
  <line x1="72" y1="96" x2="72" y2="100" stroke="#222" stroke-width="2"/>
  <line x1="92" y1="96" x2="92" y2="100" stroke="#222" stroke-width="2"/>
</svg>