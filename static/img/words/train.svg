<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Sky background -->
  <rect x="0" y="0" width="120" height="120" fill="#87CEEB"/>
  <!-- Ground -->
  <rect x="0" y="95" width="120" height="25" fill="#228B22"/>
  <!-- Tracks -->
  <rect x="0" y="90" width="120" height="5" fill="#8B4513"/>
  <rect x="0" y="93" width="120" height="2" fill="#A0522D"/>
  <!-- Train body (locomotive) -->
  <rect x="10" y="50" width="40" height="40" rx="5" fill="#FF4500"/>
  <!-- Locomotive cabin -->
  <rect x="35" y="40" width="15" height="50" rx="3" fill="#FF6347"/>
  <!-- Cabin window -->
  <rect x="38" y="45" width="9" height="12" rx="2" fill="#FFFFFF"/>
  <!-- Locomotive chimney -->
  <rect x="18" y="35" width="8" height="15" fill="#333333"/>
  <!-- Smoke puffs -->
  <circle cx="22" cy="28" r="6" fill="#999999"/>
  <circle cx="30" cy="20" r="5" fill="#BBBBBB"/>
  <circle cx="38" cy="14" r="4" fill="#DDDDDD"/>
  <!-- Locomotive wheels -->
  <circle cx="20" cy="92" r="6" fill="#333333"/>
  <circle cx="40" cy="92" r="6" fill="#333333"/>
  <!-- Car 1 -->
  <rect x="55" y="55" width="30" height="35" rx="4" fill="#1E90FF"/>
  <!-- Car 1 windows -->
  <rect x="60" y="60" width="8" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="72" y="60" width="8" height="10" rx="2" fill="#FFFFFF"/>
  <!-- Car 1 wheels -->
  <circle cx="62" cy="92" r="5" fill="#333333"/>
  <circle cx="78" cy="92" r="5" fill="#333333"/>
  <!-- Car 2 -->
  <rect x="88" y="55" width="25" height="35" rx="4" fill="#32CD32"/>
  <!-- Car 2 window -->
  <rect x="93" y="60" width="8" height="10" rx="2" fill="#FFFFFF"/>
  <!-- Car 2 wheels -->
  <circle cx="95" cy="92" r="5" fill="#333333"/>
  <circle cx="108" cy="92" r="5" fill="#333333"/>
  <!-- Connectors -->
  <rect x="50" y="70" width="5" height="4" fill="#666666"/>
  <rect x="85" y="70" width="3" height="4" fill="#666666"/>
</svg>