<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Kite body - diamond shape -->
  <polygon points="60,10 110,60 60,110 10,60" fill="#FF6B35" stroke="#333" stroke-width="2.5"/>
  <!-- Kite cross sticks -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <line x1="10" y1="60" x2="110" y2="60" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <!-- Kite tail - ribbon style -->
  <path d="M60,110 Q55,118 50,125 Q45,132 55,138 Q65,144 60,150" fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
  <!-- Tail bow -->
  <polygon points="50,125 45,120 55,120" fill="#E63946"/>
  <polygon points="55,138 60,132 50,132" fill="#E63946"/>
  <!-- String from bottom of kite going down-left -->
  <line x1="60" y1="110" x2="30" y2="150" stroke="#555" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>