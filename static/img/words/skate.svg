<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Shoe body -->
  <rect x="30" y="30" width="60" height="40" rx="10" ry="10" fill="#4A90D9"/>
  <!-- Shoe toe -->
  <ellipse cx="35" cy="50" rx="12" ry="18" fill="#4A90D9"/>
  <!-- Shoe top opening -->
  <rect x="40" y="25" width="40" height="12" rx="5" fill="#2E6BB5"/>
  <!-- Lace area -->
  <rect x="45" y="30" width="30" height="8" rx="3" fill="#3A7BD5"/>
  <!-- Laces -->
  <line x1="50" y1="32" x2="50" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="55" y1="32" x2="55" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="60" y1="32" x2="60" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="65" y1="32" x2="65" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="70" y1="32" x2="70" y2="38" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Sole -->
  <rect x="28" y="65" width="64" height="6" rx="3" fill="#333333"/>
  <!-- Wheels -->
  <circle cx="38" cy="78" r="8" fill="#E74C3C"/>
  <circle cx="38" cy="78" r="4" fill="#C0392B"/>
  <circle cx="55" cy="78" r="8" fill="#E74C3C"/>
  <circle cx="55" cy="78" r="4" fill="#C0392B"/>
  <circle cx="72" cy="78" r="8" fill="#E74C3C"/>
  <circle cx="72" cy="78" r="4" fill="#C0392B"/>
  <circle cx="89" cy="78" r="8" fill="#E74C3C"/>
  <circle cx="89" cy="78" r="4" fill="#C0392B"/>
  <!-- Wheel axles -->
  <line x1="38" y1="70" x2="38" y2="86" stroke="#333" stroke-width="2"/>
  <line x1="55" y1="70" x2="55" y2="86" stroke="#333" stroke-width="2"/>
  <line x1="72" y1="70" x2="72" y2="86" stroke="#333" stroke-width="2"/>
  <line x1="89" y1="70" x2="89" y2="86" stroke="#333" stroke-width="2"/>
</svg>