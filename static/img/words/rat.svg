<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Body -->
  <ellipse cx="60" cy="75" rx="30" ry="20" fill="#9e9e9e"/>
  <!-- Head -->
  <circle cx="40" cy="60" r="18" fill="#9e9e9e"/>
  <!-- Ears -->
  <circle cx="30" cy="45" r="8" fill="#9e9e9e"/>
  <circle cx="30" cy="45" r="5" fill="#f5c2c2"/>
  <circle cx="50" cy="45" r="8" fill="#9e9e9e"/>
  <circle cx="50" cy="45" r="5" fill="#f5c2c2"/>
  <!-- Eye -->
  <circle cx="35" cy="58" r="3" fill="#333"/>
  <!-- Nose -->
  <circle cx="25" cy="63" r="2.5" fill="#333"/>
  <!-- Whiskers -->
  <line x1="18" y1="60" x2="8" y2="56" stroke="#555" stroke-width="1.5"/>
  <line x1="18" y1="63" x2="8" y2="63" stroke="#555" stroke-width="1.5"/>
  <line x1="18" y1="66" x2="8" y2="70" stroke="#555" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M90 75 Q110 70 105 90 Q100 105 115 100" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="50" cy="92" rx="6" ry="3" fill="#7a7a7a"/>
  <ellipse cx="70" cy="92" rx="6" ry="3" fill="#7a7a7a"/>
</svg>