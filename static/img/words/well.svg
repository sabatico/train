<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect x="0" y="0" width="120" height="120" fill="#87CEEB"/>
  <!-- Stone well body -->
  <rect x="30" y="50" width="60" height="50" rx="5" fill="#808080"/>
  <!-- Stone texture lines -->
  <line x1="30" y1="65" x2="90" y2="65" stroke="#606060" stroke-width="2"/>
  <line x1="30" y1="80" x2="90" y2="80" stroke="#606060" stroke-width="2"/>
  <line x1="30" y1="95" x2="90" y2="95" stroke="#606060" stroke-width="2"/>
  <!-- Well opening (dark center) -->
  <ellipse cx="60" cy="50" rx="30" ry="12" fill="#404040"/>
  <!-- Well rim -->
  <ellipse cx="60" cy="50" rx="30" ry="12" fill="none" stroke="#808080" stroke-width="4"/>
  <!-- Arch support posts -->
  <rect x="38" y="10" width="6" height="40" fill="#8B4513"/>
  <rect x="76" y="10" width="6" height="40" fill="#8B4513"/>
  <!-- Arch top -->
  <path d="M38 20 Q60 2 82 20" fill="none" stroke="#8B4513" stroke-width="6" stroke-linecap="round"/>
  <!-- Rope -->
  <line x1="60" y1="12" x2="60" y2="55" stroke="#D2B48C" stroke-width="3"/>
  <!-- Bucket -->
  <rect x="53" y="55" width="14" height="16" rx="2" fill="#A0522D"/>
  <line x1="53" y1="55" x2="67" y2="55" stroke="#8B4513" stroke-width="2"/>
  <line x1="53" y1="71" x2="67" y2="71" stroke="#8B4513" stroke-width="2"/>
  <!-- Bucket handle -->
  <path d="M55 55 Q60 48 65 55" fill="none" stroke="#8B4513" stroke-width="2"/>
</svg>