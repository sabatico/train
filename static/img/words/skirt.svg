<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#f0e6d3"/>
  <!-- Waistband -->
  <rect x="30" y="20" width="60" height="10" rx="3" fill="#c0392b"/>
  <!-- Skirt body (triangle shape) -->
  <polygon points="30,30 90,30 105,100 15,100" fill="#e74c3c"/>
  <!-- Waistband detail -->
  <rect x="30" y="20" width="60" height="4" rx="2" fill="#a93226"/>
  <!-- Hem line -->
  <line x1="15" y1="100" x2="105" y2="100" stroke="#c0392b" stroke-width="2"/>
</svg>