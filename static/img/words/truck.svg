<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Cargo bed -->
  <rect x="10" y="40" width="70" height="35" rx="3" fill="#E74C3C"/>
  <!-- Cab -->
  <rect x="70" y="30" width="40" height="45" rx="5" fill="#3498DB"/>
  <!-- Cab window -->
  <rect x="75" y="35" width="25" height="20" rx="3" fill="#85C1E9"/>
  <!-- Cargo bed top line -->
  <rect x="10" y="38" width="70" height="4" rx="2" fill="#C0392B"/>
  <!-- Front bumper -->
  <rect x="105" y="55" width="8" height="20" rx="2" fill="#7F8C8D"/>
  <!-- Headlight -->
  <circle cx="108" cy="50" r="4" fill="#F1C40F"/>
  <!-- Rear wheel -->
  <circle cx="35" cy="80" r="14" fill="#2C3E50"/>
  <circle cx="35" cy="80" r="6" fill="#95A5A6"/>
  <!-- Front wheel -->
  <circle cx="85" cy="80" r="14" fill="#2C3E50"/>
  <circle cx="85" cy="80" r="6" fill="#95A5A6"/>
  <!-- Ground line -->
  <rect x="0" y="94" width="120" height="6" fill="#27AE60"/>
</svg>