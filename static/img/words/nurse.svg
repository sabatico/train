<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Body / Dress -->
  <rect x="40" y="50" width="40" height="50" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <!-- Head -->
  <circle cx="60" cy="30" r="18" fill="#ffd1b3" stroke="#333" stroke-width="2"/>
  <!-- Hair / Cap -->
  <rect x="42" y="12" width="36" height="12" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <rect x="42" y="12" width="36" height="6" rx="3" fill="#e0e0e0" stroke="#333" stroke-width="1.5"/>
  <!-- Red Cross on cap -->
  <rect x="56" y="14" width="8" height="4" fill="#e63946"/>
  <rect x="58" y="12" width="4" height="8" fill="#e63946"/>
  <!-- Eyes -->
  <circle cx="52" cy="28" r="2.5" fill="#333"/>
  <circle cx="68" cy="28" r="2.5" fill="#333"/>
  <!-- Smile -->
  <path d="M52 36 Q60 42 68 36" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Arms -->
  <rect x="20" y="55" width="22" height="8" rx="4" fill="#ffd1b3" stroke="#333" stroke-width="2"/>
  <rect x="78" y="55" width="22" height="8" rx="4" fill="#ffd1b3" stroke="#333" stroke-width="2"/>
  <!-- Syringe in right hand -->
  <rect x="95" y="50" width="6" height="20" rx="2" fill="#ccc" stroke="#333" stroke-width="1.5"/>
  <rect x="97" y="46" width="2" height="6" fill="#999" stroke="#333" stroke-width="1"/>
  <line x1="96" y1="70" x2="100" y2="70" stroke="#333" stroke-width="1.5"/>
  <!-- Clipboard in left hand -->
  <rect x="18" y="52" width="16" height="22" rx="2" fill="#f9f9f9" stroke="#333" stroke-width="1.5"/>
  <line x1="22" y1="58" x2="30" y2="58" stroke="#333" stroke-width="1"/>
  <line x1="22" y1="62" x2="28" y2="62" stroke="#333" stroke-width="1"/>
  <line x1="22" y1="66" x2="30" y2="66" stroke="#333" stroke-width="1"/>
  <!-- Legs -->
  <rect x="42" y="98" width="12" height="18" rx="4" fill="#ffd1b3" stroke="#333" stroke-width="2"/>
  <rect x="66" y="98" width="12" height="18" rx="4" fill="#ffd1b3" stroke="#333" stroke-width="2"/>
  <!-- Shoes -->
  <rect x="38" y="112" width="18" height="8" rx="4" fill="white" stroke="#333" stroke-width="2"/>
  <rect x="64" y="112" width="18" height="8" rx="4" fill="white" stroke="#333" stroke-width="2"/>
</svg>