<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Eye shape (almond-like) -->
  <ellipse cx="60" cy="60" rx="50" ry="30" fill="white" stroke="#333" stroke-width="3"/>
  <!-- Iris -->
  <circle cx="60" cy="60" r="18" fill="#4A7C59"/>
  <!-- Pupil -->
  <circle cx="60" cy="60" r="8" fill="#1a1a1a"/>
  <!-- Highlight on eye -->
  <circle cx="54" cy="54" r="4" fill="white" opacity="0.8"/>
</svg>