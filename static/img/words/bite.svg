<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Apple body -->
  <circle cx="60" cy="65" r="30" fill="#e74c3c"/>
  <!-- Apple stem -->
  <rect x="58" y="30" width="4" height="15" rx="2" fill="#5d4037"/>
  <!-- Apple leaf -->
  <path d="M62 35 Q75 28 70 40" fill="#2ecc71"/>
  <!-- Bite (open mouth) -->
  <path d="M40 50 Q30 45 25 55 Q20 65 30 70 Q40 75 45 65" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Upper teeth -->
  <rect x="28" y="55" width="6" height="8" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="36" y="53" width="6" height="10" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <!-- Lower teeth -->
  <rect x="30" y="63" width="6" height="8" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="38" y="64" width="6" height="7" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <!-- Tongue -->
  <ellipse cx="35" cy="68" rx="8" ry="4" fill="#ff6b6b"/>
</svg>