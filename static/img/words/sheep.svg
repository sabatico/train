  <circle cx="55" cy="48" r="14" fill="#f0f0f0"/>
  <circle cx="72" cy="50" r="13" fill="#f0f0f0"/>
  <circle cx="80" cy="62" r="11" fill="#f0f0f0"/>
  <circle cx="35" cy="65" r="10" fill="#f0f0f0"/>
  <circle cx="50" cy="60" r="12" fill="#f5f5f5"/>
  <circle cx="65" cy="55" r="11" fill="#f5f5f5"/>
  <circle cx="75" cy="70" r="10" fill="#f5f5f5"/>
  <!-- Legs -->
  <rect x="38" y="85" width="8" height="20" rx="3" fill="#333"/>
  <rect x="52" y="85" width="8" height="20" rx="3" fill="#333"/>
  <rect x="66" y="85" width="8" height="20" rx="3" fill="#333"/>
