<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Lid -->
  <rect x="30" y="10" width="60" height="15" rx="3" fill="#b0b0b0" stroke="#666" stroke-width="2"/>
  <!-- Lid top highlight -->
  <rect x="35" y="13" width="50" height="4" rx="2" fill="#d0d0d0"/>
  <!-- Jar body -->
  <rect x="25" y="25" width="70" height="75" rx="8" fill="#cce5ff" stroke="#4a90d9" stroke-width="2"/>
  <!-- Glass shine left -->
  <rect x="32" y="35" width="8" height="55" rx="4" fill="#e6f3ff" opacity="0.6"/>
  <!-- Glass shine right -->
  <rect x="78" y="40" width="6" height="40" rx="3" fill="#e6f3ff" opacity="0.4"/>
  <!-- Bottom curve -->
  <ellipse cx="60" cy="100" rx="35" ry="6" fill="#b8d8f0" stroke="#4a90d9" stroke-width="2"/>
</svg>